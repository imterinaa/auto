name: JMeter DNS Load Test

on:
  push:
    branches: [ '*' ]
  pull_request: {}
  workflow_dispatch:

jobs:
  jmeter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4

      - name: Run JMeter Test
        uses: rbhadti94/apache-jmeter-action@v0.7.0
        with:
          testFilePath: "dns_test.jmx"
          outputReportsFolder: "reports/"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-report
          path: reports/
