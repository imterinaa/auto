name: SauceDemo Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium pytest allure-pytest webdriver-manager pytest-html
        
    - name: Install Chrome and ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        sudo apt-get install -y chromium-chromedriver
        sudo ln -s /usr/bin/chromedriver /usr/local/bin/chromedriver
        
    - name: Run tests
      run: |
        python -m pytest tests/ -v --alluredir=allure-results
      env:
        DISPLAY: :99
        
    - name: Generate Allure report
      if: always()
      run: |
        curl -Lo allure-2.24.0.tgz https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.24.0/allure-commandline-2.24.0.tgz
        tar -zxvf allure-2.24.0.tgz -C /opt/
        ln -s /opt/allure-2.24.0/bin/allure /usr/local/bin/allure
        allure generate allure-results -o allure-report --clean
        
    - name: Upload report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report
  
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
    
